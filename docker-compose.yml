# Lancer : docker compose up --build
# L'API est construite depuis le dépôt voisin ../eventhub-api ;
# nginx sert de reverse proxy et seul port exposé à l'extérieur.
services:
  api:
    build: ../eventhub-api
    image: ghcr.io/ekar-071/eventhub-api:latest
    environment:
      DATABASE_URL: sqlite:////data/eventhub.db
      SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
    volumes:
      - api-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [backend]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

volumes:
  api-data:

networks:
  backend:
