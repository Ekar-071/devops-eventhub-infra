# Copier en secret.yaml (non commité) et remplacer la valeur, ou créer le secret :
#   kubectl -n eventhub create secret generic eventhub-secrets --from-literal=SECRET_KEY=<valeur>
apiVersion: v1
kind: Secret
metadata:
  name: eventhub-secrets
  namespace: eventhub
type: Opaque
stringData:
  SECRET_KEY: remplacez-moi
